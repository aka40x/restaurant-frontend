<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đổi mật khẩu | Quản lý nhà hàng</title>
  <link rel="icon" href="../../assets/images/logo.svg">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body data-root="../../" data-layout="admin">
  <header id="app-header"></header>

  <main class="container">
    <section class="card" style="max-width: 440px">
      <h2>Đổi mật khẩu</h2>
      <form id="password-form">
        <label for="current_password">Mật khẩu hiện tại *</label>
        <input id="current_password" type="password" required autocomplete="current-password">

        <label for="new_password">Mật khẩu mới *</label>
        <input id="new_password" type="password" required minlength="8" maxlength="72" autocomplete="new-password">
        <p class="form-hint">Tối thiểu 8 ký tự, khác mật khẩu hiện tại.</p>

        <label for="confirm_password">Nhập lại mật khẩu mới *</label>
        <input id="confirm_password" type="password" required autocomplete="new-password">

        <div class="form-actions">
          <button id="btn-submit" type="submit" class="btn btn-primary">Đổi mật khẩu</button>
        </div>
      </form>
    </section>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/layout.js"></script>
  <script>Auth.requireRole(["manager", "waiter", "kitchen", "cashier"]);</script>
  <script src="../../js/pages/password.js"></script>
</body>
</html>
