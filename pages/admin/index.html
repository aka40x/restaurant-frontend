<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tổng quan | Quản lý nhà hàng</title>
  <link rel="icon" href="../../assets/images/logo.svg">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body data-root="../../" data-layout="admin">
  <header id="app-header"></header>

  <main class="container">
    <section class="card">
      <h1>Trang quản lý</h1>
      <p id="welcome" class="muted"></p>
      <div class="shortcut-grid" id="shortcuts"></div>
    </section>

    <!-- Cảnh báo kho: chỉ hiện khi có nguyên liệu dưới mức tối thiểu -->
    <section class="card" id="alert-card" hidden>
      <h2>Cảnh báo</h2>
      <div class="shortcut-grid" id="alerts"></div>
    </section>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/layout.js"></script>
  <script>
    Auth.requireRole(["manager"]);
    const user = Auth.getUser();
    if (user) document.getElementById("welcome").textContent = `Xin chào ${user.full_name} (${Auth.roleLabel(user)})`;
    // Lối tắt = các mục của sidebar (trừ "Tổng quan"), cùng quy tắc phân quyền
    const role = user?.role?.name;
    document.getElementById("shortcuts").innerHTML = SIDEBAR
      .filter((item) => canSee(item, role) && !item.href.endsWith("admin/index.html"))
      .map((item) => `<a href="${document.body.dataset.root}${item.href}"><strong>${escapeHtml(item.label)}</strong></a>`)
      .join("");
    // Cảnh báo kho: số nguyên liệu dưới mức tối thiểu, bấm vào mở trang Kho đã lọc "Chỉ sắp hết".
    // Admin xem tổng của mọi chi nhánh, manager chỉ chi nhánh mình (backend tự lọc).
    api.get("/inventory/low-stock").then((rows) => {
      if (rows.length === 0) return;
      const scope = role === "admin" ? " (mọi chi nhánh)" : "";
      document.getElementById("alerts").innerHTML = `
        <a href="${document.body.dataset.root}pages/admin/inventory.html?low=true">
          <strong>${rows.length} nguyên liệu sắp hết${scope}</strong>
          <div class="muted">Bấm để xem trong trang Kho</div>
        </a>`;
      document.getElementById("alert-card").hidden = false;
    }).catch(() => { /* lỗi mạng hoặc không đủ quyền: bỏ qua, không làm hỏng trang Tổng quan */ });
  </script>
</body>
</html>
